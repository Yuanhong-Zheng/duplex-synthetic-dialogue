<svg class="pipeline-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 2505" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">V2.6 完整数据生成流程图</title><desc id="diagram-desc">从领域场景采样，经环境生成、整段剧本及审查、独立长度精简、并行语音合成、音频对齐、起声校准、静态时间轴、混音、完整性核验到训练导出。右侧为有限修复及重审分支。点击步骤可跳到下方同编号实际案例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8798a6"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.node-title{font-size:19px;font-weight:650;fill:#203648}.node-detail{font-size:14px;fill:#566b7d}.node-num{font-size:16px;font-weight:750;fill:#316e93}.node-role{font-size:13px;fill:#657b8d}.phase-label{font-size:20px;font-weight:700;fill:#35516a}.phase-sub{font-size:14px;fill:#718496}.repair-title{font-size:17px;fill:#92652b;font-weight:650}.repair-detail{font-size:13px;fill:#836c4d}a:hover .node-box,a:focus .node-box{stroke:#236d9b;stroke-width:2.5}.edge{fill:none;stroke:#8798a6;stroke-width:1.8;marker-end:url(#arrow)}.loop{fill:none;stroke:#b49262;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#arrow)}</style><rect width="1280" height="100%" rx="18" fill="#fcfdff"/><rect x="18" y="36" width="1244" height="843" rx="14" fill="#eff5fb"/><text x="42" y="81" class="phase-sub">PHASE 01</text><text x="42" y="114" class="phase-label">环境与设定</text><text x="42" y="143" class="phase-sub">生成 → Judge → 冻结</text><rect x="18" y="876" width="1244" height="603" rx="14" fill="#f1f2fb"/><text x="42" y="921" class="phase-sub">PHASE 02</text><text x="42" y="954" class="phase-label">整段剧本定稿</text><text x="42" y="983" class="phase-sub">模型决策在 TTS 前完成</text><rect x="18" y="1476" width="1244" height="963" rx="14" fill="#eef6f3"/><text x="42" y="1521" class="phase-sub">PHASE 03</text><text x="42" y="1554" class="phase-label">语音与数据编排</text><text x="42" y="1583" class="phase-sub">无实时台词生成调用</text><a href="#case-sample"><rect class="node-box" x="260" y="58" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="89">0A</text><text class="node-title" x="342" y="89">采样领域、场景与生成控制</text><text class="node-detail" x="278" y="119">冻结种子、轮数层级、表达画像轴和声景偏好</text><title>0A · 采样领域、场景与生成控制 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="53">程序</text><path class="edge" d="M565 142 V173"/><a href="#case-tasks"><rect class="node-box" x="260" y="178" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="209">0B</text><text class="node-title" x="342" y="209">生成任务方向库</text><text class="node-detail" x="278" y="239">先生成原任务风格，再补充常识问答方向</text><title>0B · 生成任务方向库 · Luna；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="173">Luna</text><path class="edge" d="M565 262 V293"/><a href="#case-tasks-judge"><rect class="node-box" x="260" y="298" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="329">0J</text><text class="node-title" x="342" y="329">审查任务方向</text><text class="node-detail" x="278" y="359">检查任务适配与 audio-only 能力边界</text><title>0J · 审查任务方向 · Sol；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="293">Sol</text><path class="loop" d="M870 325 H928"/><a href="#case-tasks-judge"><rect x="936" y="297" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="323">0R · 定向修复</text><text class="repair-detail" x="950" y="345">Luna 修复 → Sol 重审；最多 5 次审核；耗尽</text><text class="repair-detail" x="950" y="362">保留失败</text></a><path class="loop" d="M936 363 H904 V280 H800 V295"/><path class="edge" d="M565 382 V413"/><a href="#case-profile"><rect class="node-box" x="260" y="418" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="449">1</text><text class="node-title" x="342" y="449">生成任务、用户与声音画像</text><text class="node-detail" x="278" y="479">目标、角色、voice_profile 与 interaction_profile</text><title>1 · 生成任务、用户与声音画像 · Luna；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="413">Luna</text><path class="edge" d="M565 502 V533"/><a href="#case-profile-judge"><rect class="node-box" x="260" y="538" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="569">1J</text><text class="node-title" x="342" y="569">独立审查任务与画像</text><text class="node-detail" x="278" y="599">不通过则回到本阶段修复并重审</text><title>1J · 独立审查任务与画像 · Sol；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="533">Sol</text><path class="loop" d="M870 565 H928"/><a href="#case-profile-judge"><rect x="936" y="537" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="563">1R · 原阶段修复</text><text class="repair-detail" x="950" y="585">Luna 修复 → Sol 重审；最多 2 次语义审核</text></a><path class="loop" d="M936 603 H904 V520 H800 V535"/><path class="edge" d="M565 622 V653"/><a href="#case-environment"><rect class="node-box" x="260" y="658" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="689">2</text><text class="node-title" x="342" y="689">生成事实、约束和声景候选</text><text class="node-detail" x="278" y="719">模型给场景兼容候选，程序随机抽取并保留凭据</text><title>2 · 生成事实、约束和声景候选 · Sol＋程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="653">Sol＋程序</text><path class="edge" d="M565 742 V773"/><a href="#case-environment-judge"><rect class="node-box" x="260" y="778" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="809">2J</text><text class="node-title" x="342" y="809">独立审查并冻结环境</text><text class="node-detail" x="278" y="839">冻结事实、录音来源和已有第三方身份</text><title>2J · 独立审查并冻结环境 · Sol；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="773">Sol</text><path class="loop" d="M870 805 H928"/><a href="#case-environment-judge"><rect x="936" y="777" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="803">2R · 受限局部修改</text><text class="repair-detail" x="950" y="825">Sol 补丁 → 原子应用 → 重审；最多 3 次语义</text><text class="repair-detail" x="950" y="842">审核；抽样记录只读</text></a><path class="loop" d="M936 843 H904 V760 H800 V775"/><path class="edge" d="M565 862 V893"/><a href="#case-script"><rect class="node-box" x="260" y="898" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="929">3</text><text class="node-title" x="342" y="929">一次起草整段双人剧本</text><text class="node-detail" x="278" y="959">用户／助手正文、意图、行为、起声与事件锚点</text><title>3 · 一次起草整段双人剧本 · Sol；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="893">Sol</text><path class="edge" d="M565 982 V1013"/><a href="#case-structure"><rect class="node-box" x="260" y="1018" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1049">3V</text><text class="node-title" x="342" y="1049">派生停声点与完整结构检查</text><text class="node-detail" x="278" y="1079">T03 起声后 1–3 字停声；核对正文和锚点依赖</text><title>3V · 派生停声点与完整结构检查 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1013">程序</text><path class="loop" d="M870 1045 H928"/><a href="#case-structure"><rect x="936" y="1017" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="1043">3R · 编剧只输出变更</text><text class="repair-detail" x="950" y="1065">核对基底哈希，原子应用补丁；同步正文依赖锚</text><text class="repair-detail" x="950" y="1082">点；最多 5 次内容修复</text></a><path class="loop" d="M936 1083 H904 V1000 H800 V1015"/><path class="edge" d="M565 1102 V1133"/><a href="#case-script-judge"><rect class="node-box" x="260" y="1138" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1169">3J</text><text class="node-title" x="342" y="1169">完整剧本与已听边界 Judge</text><text class="node-detail" x="278" y="1199">检查事实、因果、自然度、重复、废话和事件时序</text><title>3J · 完整剧本与已听边界 Judge · Sol；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1133">Sol</text><path class="loop" d="M870 1165 H928"/><a href="#case-script-judge"><rect x="936" y="1137" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="1163">3R · 按 findings 最小修复</text><text class="repair-detail" x="950" y="1185">仍完整校验、重建已听历史、重审；不能只审修</text><text class="repair-detail" x="950" y="1202">改字段，也不能绕过原 Judge</text></a><path class="loop" d="M936 1203 H904 V1000 H800 V1015"/><path class="edge" d="M565 1222 V1253"/><a href="#case-length"><rect class="node-box" x="260" y="1258" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1289">3L</text><text class="node-title" x="342" y="1289">独立检查 250 字限制</text><text class="node-detail" x="278" y="1319">超长才精简：Luna → Sol → Sol，最多三次</text><title>3L · 独立检查 250 字限制 · 程序＋模型；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1253">程序＋模型</text><path class="loop" d="M870 1285 H928"/><a href="#case-length"><rect x="936" y="1257" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="1283">3LR · 独立三次精简</text><text class="repair-detail" x="950" y="1305">每次仍完整校验结构并做 Judge；第三次可保留</text><text class="repair-detail" x="950" y="1322">语义警告；仍须≤250字</text></a><path class="loop" d="M936 1323 H904 V1000 H800 V1015"/><path class="edge" d="M565 1342 V1373"/><a href="#case-freeze"><rect class="node-box" x="260" y="1378" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1409">3F</text><text class="node-title" x="342" y="1409">冻结最终剧本与目标已听上下文</text><text class="node-detail" x="278" y="1439">三次精简的特殊接受规则和警告单独留档</text><title>3F · 冻结最终剧本与目标已听上下文 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1373">程序</text><path class="edge" d="M565 1462 V1493"/><a href="#case-voices"><rect class="node-box" x="260" y="1498" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1529">4.1</text><text class="node-title" x="342" y="1529">建立并固定说话人参考音色</text><text class="node-detail" x="278" y="1559">用户按画像、助手固定参考、第三方独立参考</text><title>4.1 · 建立并固定说话人参考音色 · Qwen＋程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1493">Qwen＋程序</text><path class="edge" d="M565 1582 V1613"/><a href="#case-tts"><rect class="node-box" x="260" y="1618" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1649">4.2</text><text class="node-title" x="342" y="1649">并行 TTS 合成所有固定台词</text><text class="node-detail" x="278" y="1679">整段已定稿；跨案例、跨语音片段并行</text><title>4.2 · 并行 TTS 合成所有固定台词 · Qwen3-TTS；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1613">Qwen3-TTS</text><path class="edge" d="M565 1702 V1733"/><a href="#case-alignment"><rect class="node-box" x="260" y="1738" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1769">4.3</text><text class="node-title" x="342" y="1769">强制对齐：字词 → 音频时间</text><text class="node-detail" x="278" y="1799">将文本锚点对应到真实 WAV 的采样边界</text><title>4.3 · 强制对齐：字词 → 音频时间 · 对齐模型；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1733">对齐模型</text><path class="loop" d="M870 1765 H928"/><a href="#case-alignment"><rect x="936" y="1737" width="304" height="104" rx="10" fill="#fffcf7" stroke="#dcc9aa"/><text class="repair-title" x="950" y="1763">音频异常的分类处理</text><text class="repair-detail" x="950" y="1785">仅附和自身对齐耗尽：警告并省略；其他语义锚</text><text class="repair-detail" x="950" y="1802">点边界缺失：保留失败</text></a><path class="edge" d="M565 1822 V1853"/><a href="#case-onset"><rect class="node-box" x="260" y="1858" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="1889">4.4</text><text class="node-title" x="342" y="1889">裁掉插话前导静音并校准起声</text><text class="node-detail" x="278" y="1919">保留 30 ms 保护量；只在同一已听前缀内校准</text><title>4.4 · 裁掉插话前导静音并校准起声 · 程序＋VAD；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1853">程序＋VAD</text><path class="edge" d="M565 1942 V1973"/><a href="#case-schedule"><rect class="node-box" x="260" y="1978" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="2009">4.5</text><text class="node-title" x="342" y="2009">编排静态时间轴与实际已听前缀</text><text class="node-detail" x="278" y="2039">打断截停；附和继续播报；记录未播尾部</text><title>4.5 · 编排静态时间轴与实际已听前缀 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="1973">程序</text><path class="edge" d="M565 2062 V2093"/><a href="#case-mix"><rect class="node-box" x="260" y="2098" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="2129">4.6</text><text class="node-title" x="342" y="2129">叠加旁音并合成双声道音频</text><text class="node-detail" x="278" y="2159">旁语／录音以 30%–70% 增益混入，助手不停声</text><title>4.6 · 叠加旁音并合成双声道音频 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="2093">程序</text><path class="edge" d="M565 2182 V2213"/><a href="#case-integrity"><rect class="node-box" x="260" y="2218" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="2249">4.7</text><text class="node-title" x="342" y="2249">核验音频、因果与真实人声重叠</text><text class="node-detail" x="278" y="2279">检查前缀、采样范围、削波、事件与来源一致性</text><title>4.7 · 核验音频、因果与真实人声重叠 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="2213">程序</text><path class="edge" d="M565 2302 V2333"/><a href="#case-export"><rect class="node-box" x="260" y="2338" width="610" height="84" rx="12" fill="white" stroke="#d5e0e9"/><text class="node-num" x="278" y="2369">5</text><text class="node-title" x="342" y="2369">导出实际播放的训练数据</text><text class="node-detail" x="278" y="2399">只导出已播内容、实际音频与事件证据</text><title>5 · 导出实际播放的训练数据 · 程序；点击查看真实案例</title></a><text class="node-role" text-anchor="end" x="852" y="2333">程序</text><text x="260" y="2493" class="node-detail">实线：通过后继续　　虚线：修复与重审　　预算耗尽：保留失败及全部旧记录</text></svg>