<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全双工语音数据生成与评测</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#192f43;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe7ee;box-shadow:0 2px 12px #12324c0a;padding:15px clamp(16px,3vw,36px) 0}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}h1{font-size:20px;margin:0;letter-spacing:.02em}.sub{color:#6a7f90;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:12px}nav a{flex:none;text-decoration:none;color:#506678;padding:11px 15px 10px;border-bottom:3px solid transparent;font-size:14px;font-weight:600;white-space:nowrap}
nav a:hover{color:#145a86;background:#f4f8fc}nav a[aria-current=page]{color:#145a86;border-bottom-color:#267aad}
main{height:calc(100dvh - 106px);min-height:420px}iframe{border:0;width:100%;height:100%;display:block;background:#fff}iframe[hidden]{display:none}
@media(max-width:600px){header{padding-top:12px}.head{gap:6px}h1{font-size:18px}.sub{display:none}nav a{padding:10px 10px 9px;font-size:13px}main{height:calc(100dvh - 85px)}}
</style>
</head>
<body>
<header><div class="head"><h1>全双工语音数据生成与评测</h1><span class="sub">流程 · 数据 · 评测</span></div>
<nav aria-label="切换项目内容">
<a href="#pipeline" aria-controls="panel-pipeline">V2.6 流程与示例</a>
<a href="#v28" aria-controls="panel-v28">V2.8 中文百例 · 93 成功</a>
<a href="#benchmark" aria-controls="panel-benchmark">全双工 Benchmark 调研</a>
</nav></header>
<main>
<iframe id="panel-pipeline" title="管线流程图与案例说明" data-src="pipeline.html" hidden></iframe>
<iframe id="panel-v28" title="V2.8 中文 100 条案例" data-src="v28/index.html" hidden></iframe>
<iframe id="panel-benchmark" title="全双工 Benchmark 调研报告" data-src="benchmark/index.html" hidden></iframe>
</main>
<script>
(function(){
 const names=['pipeline','v28','benchmark'];
 function switchView(){
   const key=names.includes(location.hash.slice(1))?location.hash.slice(1):'pipeline';
   for(const name of names){
     const frame=document.getElementById('panel-'+name), link=document.querySelector('a[href="#'+name+'"]');
     const active=name===key; frame.hidden=!active;
     if(active&&!frame.getAttribute('src'))frame.src=frame.dataset.src;
     if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');
   }
 }
 addEventListener('hashchange',switchView);switchView();
})();
</script>
</body></html>
